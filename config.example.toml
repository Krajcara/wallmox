# Wallmox configuration
# Copy to /etc/wallmox/config.toml and fill in the [proxmox] section.
#
# These are starting values. Once you save something in the admin panel,
# the panel's settings (/var/lib/wallmox/settings.json) take precedence.

title = "Wallmox"
language = "en"          # "en" or "sr"
listen = "0.0.0.0"
port = 8080

poll_interval = 5        # seconds between Proxmox API reads
refresh_interval = 10    # seconds between screen updates on the tablet
history_size = 72        # CPU trend samples (72 x 5 s = 6 minutes)

# Optional: require http://<ip>:8080/status?key=... on the tablet
status_key = ""

# Set to true when Wallmox is reached through NPM, Caddy or Traefik
behind_proxy = false

# Show generated data instead of talking to Proxmox
demo = false

[proxmox]
host = "192.168.1.10"            # any node of the cluster
port = 8006
token_id = "wallmox@pve!dash"
token_secret = "00000000-0000-0000-0000-000000000000"
verify_ssl = false               # true, false, or a path to a CA file
timeout = 5

# Colors switch to amber at "warn" and red at "crit" (percent)
[thresholds.cpu]
warn = 70
crit = 90

[thresholds.mem]
warn = 80
crit = 92

[thresholds.storage]
warn = 80
crit = 90
